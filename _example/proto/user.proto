syntax = "proto3";
package user;

import "patch/go.proto";;

import "protoc-gen-openapiv2/options/annotations.proto";
import "hopeio/utils/validator/validator.proto";
import "google/api/annotations.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/timestamp.proto";

option java_package = "mix.hopeio.protobuf.user";
option go_package = "github.com/hopeio/mix/_example/protobuf/user";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    version: "1.0"
  }
};

message User {
  uint64 id = 1 [(go.field) = {tags:'gorm:"primaryKey;"'}];
  string name = 2 [(go.field) = {tags:'gorm:"size:10;not null" comment:"nickname"'}];
  string password = 5 [(go.field) = {tags:'json:"-" gorm:"size:32;not null" validate:"gte=8,lte=15" comment:"password"'}];
  string mail = 6 [(go.field) = {tags:'gorm:"size:32" validate:"email" comment:"email"'}];
  string phone = 7 [(go.field) = {tags:'gorm:"size:32" validate:"phone" comment:"phone number"'}];
  // Gender: 0 not filled in, 1 male, 2 female.
  Gender gender = 8 [(go.field) = {tags:'gorm:"type:int2;default:0"'}, (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type:INTEGER
  }];
  Role role = 24 [(go.field) = {tags:'gorm:"type:int2;default:0"'}];
  UserStatus status = 28 [(go.field) = {tags:'gorm:"type:int2;default:0"'}, (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    read_only:true
  }];
}

message SignupReq {
  // Password.
  string password = 4 [(go.field) = {tags:'validate:"required,gte=6,lte=15" comment:"password"'}, (validator.field) = {
    length_gt: 5,
    custom_error: "auth.err.pwdMinLength"
  }, (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {title: "Password",
    min_length: 6}];
  string name = 1 [(go.field) = {tags:'validate:"required,gte=3,lte=10" comment:"nickname"'}];
  Gender gender = 3 [(go.field) = {tags:'validate:"required" comment:"gender"'}];
  // Email address.
  string mail = 6 [(go.field) = {tags:'validate:"omitempty,email" comment:"email"'}];
  // Phone number.
  string phone = 7 [(go.field) = {tags:'validate:"omitempty,phone" comment:"phone number"'}];
  // Verification code.
  string vCode = 8 [(go.field) = {tags:'validate:"required" comment:"verification code"'}];
}

// The gender of a user.
enum Gender{
  GenderPlaceholder = 0;
  GenderUnfilled = 1 ;
  GenderMale = 2 ;
  GenderFemale = 3;
}

// The role of a user.
enum Role {
  PlaceholderRole = 0;
  RoleNormal = 1;
  RoleAdmin = 2;
  RoleSuperAdmin = 3;
}

// The role of a user.
enum UserStatus {
  UserStatusPlaceholder = 0;
  UserStatusInActive = 1;
  UserStatusActivated = 2;
  UserStatusFrozen = 3;
  UserStatusDeleted = 4;
}

enum UserErr {
  UserErrPlaceholder = 0;
  UserErrLogin = 1000;
  UserErrNoActive = 1001;
  UserErrNoAuthority = 1002;
  UserErrLoginTimeout = 1003;
  UserErrInvalidToken = 1004;
  UserErrNoLogin = 1005;
}

message GetUserReq {
  uint64 id = 1 [(go.field) = {tags:'gorm:"primaryKey;"'}];
}

service UserService {
  // Signup.
  rpc Signup (SignupReq) returns (google.protobuf.StringValue) {
    option (google.api.http) = {
      post: "/api/user"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags:["User APIs", "v1.0.0"]
      summary : "Signup"
      description : "Signup endpoint"
    };
  }

  rpc GetUser (GetUserReq) returns (User) {
    option (google.api.http) = {
      get: "/api/{id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags:["User APIs", "v1.0.0"]
      summary : "Details"
      description : "Details endpoint"
    };
  }
}